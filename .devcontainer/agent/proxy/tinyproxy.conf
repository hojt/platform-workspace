# Egress proxy for the coding-agent environment. See ADR-0010.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100

# In foreground mode (-d) without a LogFile, tinyproxy logs to stdout,
# so `podman logs` shows every request.
LogLevel Info

# Only allow HTTPS tunnels to the standard port.
ConnectPort 443

# Step 4b: enable the allowlist.
#Filter "/etc/tinyproxy/allowlist"
#FilterDefaultDeny Yes
#FilterURLs No
