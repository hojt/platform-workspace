# Workspace-specific layout of the coding-agent sandbox. See ADR-0010.
#
# Sourced by agent.sh on the host. Keep this file to plain array
# assignments. Each entry must match a mount in devcontainer.json;
# agent.sh verifies that it does before starting an agent.

# Sibling repositories mounted read-only under repos/<name>.
workspace_repositories=()

# Paths the agent may write to.
agent_writable_paths=(
  components
  docs
)

# Paths that are read-only in addition to the baseline in agent.sh.
agent_protected_paths=(
  scripts
)

# Agent-only mounts, such as caches and build output.
agent_isolated_paths=(
  components/example-frontend/node_modules
  components/example-frontend/dist
  components/example-backend/target
)

# Paths hidden behind empty mounts, such as local key material.
agent_hidden_paths=()
