version: "3"

vars:
  REPOS: >-
    .
    repos/homelab
    repos/local-platform
    repos/local-environments

tasks:
  status:
    desc: Show Git status for all workspace repositories
    cmds:
      - |
        set -eu

        for repo in {{.REPOS}}; do
          printf '\n== %s ==\n' "${repo}"
          git -C "${repo}" status --short --branch
        done

  diff:
    desc: Show unstaged changes for all workspace repositories
    cmds:
      - |
        set -eu

        for repo in {{.REPOS}}; do
          printf '\n== %s ==\n' "${repo}"
          git -C "${repo}" diff
        done

  diff:staged:
    desc: Show staged changes for all workspace repositories
    cmds:
      - |
        set -eu

        for repo in {{.REPOS}}; do
          printf '\n== %s ==\n' "${repo}"
          git -C "${repo}" diff --staged
        done

  platform:up:
    desc: Create the local platform
    cmds:
      - task --taskfile repos/local-platform/Taskfile.yml up

  platform:down:
    desc: Delete the local platform
    cmds:
      - task --taskfile repos/local-platform/Taskfile.yml down

  platform:status:
    desc: Show local platform status
    cmds:
      - task --taskfile repos/local-platform/Taskfile.yml status

  environment:bootstrap:
    desc: Bootstrap Argo CD applications
    cmds:
      - task --taskfile repos/local-environments/Taskfile.yml argocd:bootstrap

  environment:refresh:
    desc: Refresh all Argo CD applications
    cmds:
      - task --taskfile repos/local-environments/Taskfile.yml argocd:refresh

  environment:apps:
    desc: List Argo CD applications
    cmds:
      - task --taskfile repos/local-environments/Taskfile.yml argocd:apps
